<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Money Talks Club · Dîner N°1</title>
<meta property="og:title" content="Money Talks Club · Dîner N°1">
<meta property="og:image" content="slide1.jpg">
<meta name="robots" content="noindex">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1c0710;overflow:hidden}
.track{display:flex;height:100dvh;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100vw;height:100dvh;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:12px 12px 44px}
.frame{position:relative;height:100%;max-width:100%;aspect-ratio:1080/1350;max-height:calc((100vw - 24px)*1.25)}
.frame img{width:100%;height:100%;display:block;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
.frame a{position:absolute;display:block;border-radius:12px}
.frame a:focus-visible{outline:2px solid #C9A35A;outline-offset:2px}
.dots{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:10px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;background:rgba(226,228,190,.35);cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:#C9A35A}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(226,228,190,.3);
  background:rgba(28,7,16,.5);color:#E2E4BE;font-size:20px;cursor:pointer;display:none}
.nav.prev{left:16px}.nav.next{right:16px}
@media (hover:hover) and (min-width:800px){.nav{display:block}}
</style></head><body>
<main class="track" id="t">
<section class="slide" aria-label="Couverture : le dîner avant-première, Dîner N°1"><div class="frame"><img src="slide1.jpg" alt="Couverture : le dîner avant-première, Dîner N°1"></div></section>
<section class="slide" aria-label="Le programme de la soirée"><div class="frame"><img src="slide2.jpg" alt="Le programme de la soirée"></div></section>
<section class="slide" aria-label="Les convives du dîner"><div class="frame"><img src="slide3.jpg" alt="Les convives du dîner"><a href="https://www.linkedin.com/in/noa-cherdel/" target="_blank" rel="noopener" aria-label="LinkedIn de Noa" style="left:11.574%;top:20.088%;width:23.148%;height:23.111%"></a><a href="https://www.linkedin.com/in/lin-celine1708/" target="_blank" rel="noopener" aria-label="LinkedIn de Céline" style="left:38.426%;top:20.088%;width:23.148%;height:23.111%"></a><a href="https://www.linkedin.com/in/fmleon/" target="_blank" rel="noopener" aria-label="LinkedIn de Flora Marie" style="left:65.278%;top:20.088%;width:23.148%;height:23.111%"></a><a href="https://www.linkedin.com/in/ad%C3%A8le-gatto-a24783186/" target="_blank" rel="noopener" aria-label="LinkedIn de Adèle" style="left:6.574%;top:48.236%;width:15.741%;height:19.333%"></a><a href="https://www.linkedin.com/in/alison-pastres/" target="_blank" rel="noopener" aria-label="LinkedIn de Alison" style="left:24.352%;top:48.236%;width:15.741%;height:19.333%"></a><a href="https://www.linkedin.com/in/amanda-leloup/" target="_blank" rel="noopener" aria-label="LinkedIn de Amanda" style="left:42.130%;top:48.236%;width:15.741%;height:19.333%"></a><a href="https://www.linkedin.com/in/dou%C3%A2a-sabone-669a87277/" target="_blank" rel="noopener" aria-label="LinkedIn de Douâa" style="left:59.907%;top:48.236%;width:15.741%;height:19.333%"></a><a href="https://www.linkedin.com/in/randjelovicemma/" target="_blank" rel="noopener" aria-label="LinkedIn de Emma" style="left:77.685%;top:48.236%;width:15.741%;height:19.333%"></a><a href="https://www.linkedin.com/in/fella-benabbas/" target="_blank" rel="noopener" aria-label="LinkedIn de Fella" style="left:6.574%;top:70.088%;width:15.741%;height:19.333%"></a><a href="https://www.linkedin.com/in/jade-elisabeth-53a489228/" target="_blank" rel="noopener" aria-label="LinkedIn de Jade" style="left:24.352%;top:70.088%;width:15.741%;height:19.333%"></a><a href="https://www.linkedin.com/in/leablanes" target="_blank" rel="noopener" aria-label="LinkedIn de Léa" style="left:42.130%;top:70.088%;width:15.741%;height:19.333%"></a><a href="https://www.linkedin.com/in/marie-simion-67b258252" target="_blank" rel="noopener" aria-label="LinkedIn de Marie" style="left:59.907%;top:70.088%;width:15.741%;height:19.333%"></a><a href="https://www.linkedin.com/in/romane-foglino/" target="_blank" rel="noopener" aria-label="LinkedIn de Romane" style="left:77.685%;top:70.088%;width:15.741%;height:19.333%"></a></div></section>
</main>
<button class="nav prev" aria-label="Slide précédente">&#8249;</button>
<button class="nav next" aria-label="Slide suivante">&#8250;</button>
<nav class="dots" aria-label="Slides"><button aria-label="Slide 1"></button><button aria-label="Slide 2"></button><button aria-label="Slide 3"></button></nav>
<script>
const t=document.getElementById('t'),dots=[...document.querySelectorAll('.dots button')];
const cur=()=>Math.round(t.scrollLeft/t.clientWidth);
const go=i=>t.scrollTo({left:Math.max(0,Math.min(dots.length-1,i))*t.clientWidth,behavior:'smooth'});
const upd=()=>dots.forEach((d,i)=>d.setAttribute('aria-current',i===cur()));
t.addEventListener('scroll',()=>requestAnimationFrame(upd));upd();
dots.forEach((d,i)=>d.onclick=()=>go(i));
document.querySelector('.prev').onclick=()=>go(cur()-1);
document.querySelector('.next').onclick=()=>go(cur()+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur()+1);if(e.key==='ArrowLeft')go(cur()-1)});
</script>
</body></html>
